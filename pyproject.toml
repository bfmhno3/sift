[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[project]
name = "sift"
version = "0.1.0"
description = "A local full-text search engine for Markdown posts."
requires-python = ">=3.14"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = [
  "sqlalchemy>=2.0.51",
  "typer>=0.25",
  "click>=8.2.1",
  "rich>=15",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.139",
  "uvicorn>=0.51",
  "httpx>=0.28",
  "pydantic>=2.13",
]
gui = [
  "sv-ttk>=2.6",
  "darkdetect>=0.8",
]

[project.scripts]
sift = "sift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.pytest.ini_options]
addopts = "--doctest-modules -q"
testpaths = ["tests", "src"]
markers = [
  "slow: needs the full corpus or many generated cases",
]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src"]
mypy_path = "src"

# darkdetect ships neither stubs nor py.typed; sift.gui.tk_app wraps
# its one call in a typed function.
[[tool.mypy.overrides]]
module = ["darkdetect"]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
pythonVersion = "3.14"
reportMissingTypeStubs = false
